<title>Etiquetar prendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400..700&display=swap">
<style>
:root{
  --bg:#f2f3f8; --surface:#ffffff; --surface-2:#eceef5;
  --ink:#141729; --ink-2:#434964; --ink-3:#636985;
  --line:#e0e3ec; --line-2:#c8ccdb;
  --accent:#0b6b68; --on-accent:#ffffff; --accent-soft:#dcf0ee;
  --ok:#16703d; --no:#ad2a22; --no-soft:#fbe3e0;
  --shadow:0 1px 2px rgba(20,23,41,.05),0 8px 22px -12px rgba(20,23,41,.18);
  --stage:#0e111b;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e111b; --surface:#161a28; --surface-2:#1e2335;
  --ink:#eceff8; --ink-2:#b9bed4; --ink-3:#9097b4;
  --line:#262c42; --line-2:#363d58;
  --accent:#52d3c6; --on-accent:#062421; --accent-soft:#12363a;
  --ok:#62d48e; --no:#ff8f86; --no-soft:#401d1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.6);
  --stage:#080a11;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e111b; --surface:#161a28; --surface-2:#1e2335;
  --ink:#eceff8; --ink-2:#b9bed4; --ink-3:#9097b4;
  --line:#262c42; --line-2:#363d58;
  --accent:#52d3c6; --on-accent:#062421; --accent-soft:#12363a;
  --ok:#62d48e; --no:#ff8f86; --no-soft:#401d1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.6);
  --stage:#080a11;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
p{margin:0}
.wrap{max-width:560px;margin-inline:auto;padding-inline:16px}

.top{padding-block:14px 8px;display:grid;gap:4px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kicker{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:0;font:700 26px/1.05 var(--f-display);letter-spacing:-.02em}
.save{display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--f-mono);color:var(--ink-2);padding:7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.save[data-s="saved"] i{background:var(--ok)}
.save[data-s="saving"] i{background:#c98b00}
.save[data-s="error"] i{background:var(--no)}

.prog{display:grid;gap:6px;padding-bottom:10px}
.prog .txt{display:flex;justify-content:space-between;font:500 12px/1 var(--f-mono);color:var(--ink-2)}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}

.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--stage);border-radius:14px;display:grid;place-items:center;height:min(32vh,300px);overflow:hidden;box-shadow:var(--shadow)}
.stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.stage .num{position:absolute;left:10px;top:10px;font:500 12px/1 var(--f-mono);background:rgba(0,0,0,.66);color:#fff;padding:6px 8px;border-radius:6px}
.stage .st{position:absolute;right:10px;top:10px;font:500 12px/1 var(--f-mono);padding:6px 8px;border-radius:6px;background:var(--accent);color:var(--on-accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:14px;margin-top:12px;box-shadow:var(--shadow);min-width:0}
.grp{display:grid;gap:8px}
.lab{display:flex;justify-content:space-between;align-items:baseline;font:500 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.lab b{font:600 12px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--accent)}
.sub{font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 14px/1 var(--f-body)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.actions{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font:600 15px/1 var(--f-body)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.no{color:var(--no);border-color:var(--no)}
.btn.no[aria-pressed="true"]{background:var(--no-soft)}
.btn:disabled{opacity:.45}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cell{aspect-ratio:1;min-height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font:500 13px/1 var(--f-mono)}
.cell.done{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.cell.part{border-style:dashed;border-color:var(--accent)}
.cell.skip{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.cell.now{outline:2px solid var(--ink);outline-offset:1px}
.fin{padding:18px 14px;text-align:center;display:grid;gap:6px}
.fin h2{margin:0;font:700 22px/1.15 var(--f-display)}
.note{color:var(--ink-3);font-size:13px}
.empty{padding:22px 14px;display:grid;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="top wrap">
    <div class="toprow"><span class="kicker">TFM · Etiquetado</span><span id="save" class="save" data-s="load" role="status" aria-live="polite"><i></i><span>Cargando…</span></span></div>
    <h1>Etiquetar prendas</h1>
  </header>
  <div class="wrap prog"><div class="txt"><span id="ptxt">0 de 0</span><span id="pflt"></span></div><div class="meter"><i id="pbar" style="width:0%"></i></div></div>
  <main class="wrap" id="view"></main>
  <div class="wrap" style="padding-block:20px 80px"><p class="note">Cada toque se guarda solo. Un recorte cuenta como hecho con los cuatro campos; con borde discontinuo, a medias. No te enseño lo que predice el modelo para no influirte.</p></div>
</div>

<script type="application/json" id="crops">__CROPS__</script>
<script>
(function(){
'use strict';
var CROPS=[];try{CROPS=JSON.parse(document.getElementById('crops').textContent)||[]}catch(e){}
var TIPOS=[
 ['Arriba',['Camiseta manga corta','Camiseta de tirantes','Camiseta manga larga','Top','Camisa','Polo','Sudadera',['Hoodie','Hoodie (con capucha)'],'Jersey','Chaleco sin mangas']],
 ['Abrigo',['Chaqueta','Americana','Abrigo','Plumas']],
 ['Abajo',['Pantalón','Falda','Short','Legging/Malla']],
 ['Cuerpo entero',['Vestido','Mono']],
 ['Calzado',['Zapatillas deportivas','Zapatillas casual/lifestyle','Zapatos de vestir','Zapatos de tacón','Sandalias','Botas']],
 ['Accesorio',['Bolso','Riñonera','Gorra/Gorro/Sombrero']]
];
var ESTAMP=['liso','rayas','cuadros / tartán','gráfico / dibujo','texto / logo','camuflaje','otro'];
var TEJIDOS=['denim (vaquero)','cuero / vinilo','algodón','punto','felpa / polar','técnico / impermeable','pana','terciopelo','seda / satén','tul / encaje','tweed / bouclé','lino','no se distingue'];
var FORMAS=['oversized / baggy','regular','ajustada','corta / cropped','no aplica'];
var S={db:null,absent:false,lab:{},i:0,loaded:false,inflight:{},dirty:{},timers:{}};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var SAVE={load:'Cargando…',saved:'Guardado',saving:'Guardando…',error:'No se pudo guardar',off:'Sin base de datos'};
function setSave(s,msg){var el=$('#save');el.setAttribute('data-s',s);el.querySelector('span').textContent=SAVE[s]||s;if(msg)el.title=msg;else el.removeAttribute('title')}
function done(id){var l=S.lab[id];return !!l&&(l.x===true||(!!l.tipo&&!!l.estampado&&!!l.tejido&&!!l.forma))}
function partial(id){var l=S.lab[id];return !!l&&!l.x&&!done(id)&&!!(l.tipo||l.estampado||l.tejido||l.forma)}
function nDone(){var n=0;CROPS.forEach(function(c){if(done(c.id))n++});return n}
function firstPending(from){for(var k=0;k<CROPS.length;k++){var j=(from+k)%CROPS.length;if(!done(CROPS[j].id))return j}return -1}

/* ---------- guardado ---------- */
function queue(id){S.dirty[id]=true;setSave('saving');clearTimeout(S.timers[id]);S.timers[id]=setTimeout(function(){flush(id)},250)}
function flush(id){
  if(!S.db||S.inflight[id]||!S.dirty[id])return;
  S.dirty[id]=false;S.inflight[id]=true;
  var l=S.lab[id]||{};
  var body={tipo:l.tipo||'',estampado:l.estampado||'',tejido:l.tejido||'',forma:l.forma||'',x:!!l.x,t:new Date().toISOString()};
  S.db.doc('etiquetas/c'+id).set(body).then(function(){
    S.inflight[id]=false;
    if(S.dirty[id])flush(id);else if(!busy())setSave('saved');
  },function(e){S.inflight[id]=false;S.dirty[id]=true;setSave('error',e&&e.message)});
}
function busy(){var k;for(k in S.dirty)if(S.dirty[k])return true;for(k in S.inflight)if(S.inflight[k])return true;return false}
function onSnap(snap){
  snap.docs.forEach(function(d){
    var id=d.id.replace(/^c/,'');
    if(S.dirty[id]||S.inflight[id])return;
    var v=d.data()||{};
    S.lab[id]={tipo:v.tipo||'',estampado:v.estampado||'',tejido:v.tejido||'',forma:v.forma||'',x:v.x===true};
  });
  var first=!S.loaded;S.loaded=true;
  if(first){var p=firstPending(0);S.i=p<0?0:p;setSave('saved')}
  render();
}

/* ---------- pintado ---------- */
function chips(campo,valores,sel){
  return '<div class="chips">'+valores.map(function(v){var val=Array.isArray(v)?v[0]:v,et=Array.isArray(v)?v[1]:v;return '<button class="chip" data-c="'+campo+'" data-v="'+esc(val)+'" aria-pressed="'+(sel===val)+'">'+esc(et)+'</button>'}).join('')+'</div>';
}
function render(){
  var n=nDone(),tot=CROPS.length;
  $('#ptxt').textContent=n+' de '+tot;$('#pbar').style.width=(tot?100*n/tot:0)+'%';
  var v=$('#view');
  if(!tot){v.innerHTML='<section class="card empty"><h2 style="margin:0;font:700 20px var(--f-display)">No hay recortes</h2><p class="note">Claude los carga aquí al preparar cada tanda.</p></section>';return}
  if(S.absent){v.innerHTML='<section class="card empty"><h2 style="margin:0;font:700 20px var(--f-display)">Aquí no se puede guardar</h2><p class="note">Esta página guarda tus respuestas en claude.ai. Ábrela desde allí.</p></section>';return}
  if(n===tot&&S.fin!==false){
    v.innerHTML='<section class="card fin"><h2>Hecho: '+tot+' de '+tot+'</h2><p class="note">Ya puedes decírmelo en el chat y entreno con tus etiquetas.</p><button class="btn" id="rev">Repasar</button></section>'+grid();
    var r=$('#rev');if(r)r.onclick=function(){S.fin=false;S.i=0;render()};
    wireGrid();return;
  }
  var c=CROPS[S.i],l=S.lab[c.id]||{};
  var tip=TIPOS.map(function(g){return '<div class="sub">'+esc(g[0])+'</div>'+chips('tipo',g[1],l.tipo)}).join('');
  v.innerHTML=
   '<div class="stage"><img src="'+c.src+'" alt="Recorte '+esc(c.id)+'"><span class="num">'+(S.i+1)+' / '+tot+'</span>'+(done(c.id)?'<span class="st">'+(l.x?'no sirve':'hecho')+'</span>':'')+'</div>'+
   '<section class="card">'+
   '<div class="grp"><div class="lab"><span>Tipo de prenda</span><b>'+esc(l.tipo||'')+'</b></div>'+tip+'</div>'+
   '<div class="grp"><div class="lab"><span>Estampado</span><b>'+esc(l.estampado||'')+'</b></div>'+chips('estampado',ESTAMP,l.estampado)+'</div>'+
   '<div class="grp"><div class="lab"><span>Tejido</span><b>'+esc(l.tejido||'')+'</b></div>'+chips('tejido',TEJIDOS,l.tejido)+'</div>'+
   '<div class="grp"><div class="lab"><span>Forma</span><b>'+esc(l.forma||'')+'</b></div>'+chips('forma',FORMAS,l.forma)+'</div>'+
   '<div class="actions"><button class="btn" id="ant"'+(S.i===0?' disabled':'')+'>←</button><button class="btn no" id="nos" aria-pressed="'+(l.x===true)+'">No sirve este recorte</button><button class="btn pri" id="sig">→</button></div>'+
   '</section>'+
   '<section class="card"><div class="lab"><span>Todos los recortes</span></div>'+grid()+'</section>';
  $('#ant').onclick=function(){go(S.i-1)};
  $('#sig').onclick=function(){go(S.i+1)};
  $('#nos').onclick=function(){var id=CROPS[S.i].id,x=!(S.lab[id]&&S.lab[id].x);S.lab[id]={tipo:'',estampado:'',tejido:'',forma:'',x:x};queue(id);render();if(x)advance()};
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){b.onclick=function(){pick(b.getAttribute('data-c'),b.getAttribute('data-v'))}});
  wireGrid();
}
function grid(){
  return '<div class="grid">'+CROPS.map(function(c,k){var cls=(S.lab[c.id]&&S.lab[c.id].x)?' skip':(done(c.id)?' done':(partial(c.id)?' part':''));return '<button class="cell'+cls+(k===S.i?' now':'')+'" data-k="'+k+'" aria-label="Recorte '+(k+1)+'">'+(k+1)+'</button>'}).join('')+'</div>';
}
function wireGrid(){Array.prototype.forEach.call(document.querySelectorAll('.cell'),function(b){b.onclick=function(){S.fin=false;go(+b.getAttribute('data-k'))}})}
function go(k){if(k<0||k>=CROPS.length)return;S.i=k;render();window.scrollTo(0,0)}
function advance(){setTimeout(function(){var p=firstPending(S.i+1);if(p>=0&&p!==S.i)go(p);else render()},260)}
function pick(campo,valor){
  var id=CROPS[S.i].id,l=S.lab[id]||(S.lab[id]={tipo:'',estampado:'',tejido:'',forma:'',x:false});
  l.x=false;l[campo]=(l[campo]===valor)?'':valor;
  queue(id);render();
  if(l.tipo&&l.estampado&&l.tejido&&l.forma)advance();
}

/* ---------- arranque ---------- */
render();setSave('load');
var cl=window.claude;
if(!cl||typeof cl.use!=='function'){S.absent=true;setSave('off');render();return}
cl.use('db').then(function(db){
  if(!db){S.absent=true;setSave('off');render();return}
  S.db=db;
  db.collection('etiquetas').onSnapshot(onSnap,function(e){setSave('error',e&&e.message);S.loaded=true;render()});
}).catch(function(){S.absent=true;setSave('off');render()});
})();
</script>
