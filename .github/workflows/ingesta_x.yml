name: Ingesta X — moda por estilo

on:
  workflow_dispatch: {}
  schedule:
    # "Cada hora" en teoría -- en la práctica GitHub lo retrasa bastante en repos con poco
    # tráfico (huecos reales medidos: 2.5-6.5h, no 1h). comprobar_horario.py decide si ESTA
    # hora (la real, la que sea) está en la lista configurada en config.json (activo +
    # horas_locales + zona_horaria). El horario se cambia editando ese fichero, no este cron.
    # Un disparo manual (workflow_dispatch) se salta esta comprobación siempre.
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  procesar-cola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar horario (solo aplica a disparos programados)
        id: horario
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 experimentos/ingesta_x/herramientas/comprobar_horario.py
          else
            echo "toca=true" >> "$GITHUB_OUTPUT"
            echo "Disparo manual: se ejecuta sin comprobar config.json."
          fi

      - uses: actions/setup-python@v5
        if: steps.horario.outputs.toca == 'true'
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        if: steps.horario.outputs.toca == 'true'
        run: pip install -r experimentos/ingesta_x/requirements.txt

      - name: Lanzar búsquedas automáticas (los 7 estilos, sin intervención manual)
        if: steps.horario.outputs.toca == 'true'
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python experimentos/ingesta_x/herramientas/lanzar_busquedas_automaticas.py

      - name: Procesar cola de URLs pendientes
        if: steps.horario.outputs.toca == 'true'
        run: python experimentos/ingesta_x/herramientas/procesar_cola.py

      - name: Importar lo descargado a la galería (sin revisar)
        if: steps.horario.outputs.toca == 'true'
        run: python experimentos/ingesta_x/herramientas/importar_a_galeria.py

      - name: Comitear resultados (si hay algo nuevo)
        if: steps.horario.outputs.toca == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add experimentos/ingesta_x/cola experimentos/ingesta_x/data \
            experimentos/ingesta_x/panel/data/clasificaciones.json \
            experimentos/ingesta_x/panel/static/fotos
          if git diff --staged --quiet; then
            echo "Nada que comitear."
            exit 0
          fi
          git commit -m "ingesta_x: procesa cola e importa a la galeria automaticamente"

          # La galería (panel/app.py) escribe a estos mismos ficheros por su cuenta en cada
          # tap -- un push aquí puede llegar justo cuando main se acaba de mover (pasó de
          # verdad: 2026-09-27, run 36347609781, "! [rejected] ... fetch first"). Reintenta
          # con rebase antes de rendirse -- NUNCA con "reset --hard": lo que se acaba de
          # descargar en los pasos anteriores (fotos, clasificaciones.json) solo vive en este
          # working tree, un reset lo perdería de verdad. No es como guardar_con_reintentos()
          # en buscar_x.py, que puede regenerar su commit desde datos que sigue teniendo en
          # memoria -- aquí no hay de dónde regenerarlo sin re-descargar todo.
          for intento in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push OK (intento $intento de 5)."
              exit 0
            fi
            echo "Push rechazado (intento $intento de 5), reintentando tras rebase..."
            sleep $((intento * 5))
            if ! git pull --rebase origin main; then
              echo "Rebase con conflicto real, no se puede resolver solo -- se para aquí." >&2
              git rebase --abort
              exit 1
            fi
          done
          echo "Push seguía fallando tras 5 intentos." >&2
          exit 1
