name: Ingesta X — moda por estilo

on:
  workflow_dispatch: {}
  schedule:
    # Cada hora — comprobar_horario.py decide si ESTA hora es la que toca según config.json
    # (activo + hora_local + zona_horaria). El horario real se cambia editando ese fichero,
    # no este cron. Un disparo manual (workflow_dispatch) se salta esta comprobación siempre.
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  procesar-cola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar horario (solo aplica a disparos programados)
        id: horario
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 experimentos/ingesta_x/herramientas/comprobar_horario.py
          else
            echo "toca=true" >> "$GITHUB_OUTPUT"
            echo "Disparo manual: se ejecuta sin comprobar config.json."
          fi

      - uses: actions/setup-python@v5
        if: steps.horario.outputs.toca == 'true'
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        if: steps.horario.outputs.toca == 'true'
        run: pip install -r experimentos/ingesta_x/requirements.txt

      - name: Procesar cola de URLs pendientes
        if: steps.horario.outputs.toca == 'true'
        run: python experimentos/ingesta_x/herramientas/procesar_cola.py

      - name: Comitear resultados (si hay algo nuevo)
        if: steps.horario.outputs.toca == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add experimentos/ingesta_x/cola experimentos/ingesta_x/data
          git diff --staged --quiet || git commit -m "ingesta_x: procesa cola automaticamente"
          git push
