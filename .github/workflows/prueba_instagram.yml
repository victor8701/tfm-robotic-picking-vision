name: Prueba de Instagram

# Comprueba en un minuto, sin esperar a la revista del lunes, que las claves de Instagram (Windsor, y Meta cuando exista) están bien puestas.
# Se lanza a mano: pestaña Actions → «Prueba de Instagram» → Run workflow. El resultado sale en español en el resumen de la ejecución.
# Este fichero tiene que estar en la rama principal (main); el código de la prueba se toma de la rama analisis-mercado.

on:
  workflow_dispatch:
    inputs:
      todas:
        description: 'Ensayo de la lectura semanal: lee con Meta las cuentas de las fuentes como lo hará la tarea del lunes, con esperas si Meta limita la app (gasta ~80 % de la cuota de esa hora: sin otras pruebas en la última hora); si no, solo unas de muestra'
        type: boolean
        default: false
      coste:
        description: 'Medir cuánta cuota de Meta gasta cada forma de pedir las publicaciones (unas 16 peticiones; con la cuota libre, sin otras pruebas en la última hora)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
      PRUEBA_TODAS: ${{ inputs.todas && '1' || '0' }}
      PRUEBA_COSTE: ${{ inputs.coste && '1' || '0' }}
    steps:
      - name: Código (rama analisis-mercado)
        uses: actions/checkout@v4
        with:
          ref: analisis-mercado
          path: codigo
      - name: Probar las claves
        shell: bash
        working-directory: codigo/experimentos/analisis_mercado
        run: python3 prueba_instagram.py
