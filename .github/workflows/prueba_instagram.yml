name: Prueba de Instagram

# Comprueba en un minuto, sin esperar a la revista del lunes, que las claves de Instagram (Windsor, y Meta cuando exista) están bien puestas.
# Se lanza a mano: pestaña Actions → «Prueba de Instagram» → Run workflow. El resultado sale en español en el resumen de la ejecución.
# Este fichero tiene que estar en la rama principal (main); el código de la prueba se toma de la rama analisis-mercado.

on:
  schedule:
    # Prueba única pedida por Víctor el 27-oct-2026: Meta frenó la app («código 4») por demasiadas peticiones seguidas y se repite pasada la hora, con su ordenador apagado.
    # Es un cron anual (día 27 del mes 10), por eso el primer paso solo deja pasar el 2026-10-27; se puede borrar este bloque cuando haya corrido.
    - cron: '17 15 27 10 *'
  workflow_dispatch:
    inputs:
      todas:
        description: 'Probar con Meta las 68 cuentas de las fuentes (gasta unas 70 de las ~200 peticiones por hora de la app); si no, solo unas cuentas de muestra'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
      PRUEBA_TODAS: ${{ (github.event_name == 'schedule' || inputs.todas) && '1' || '0' }}
    steps:
      - name: Solo el día programado
        id: fecha
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [ "$(date -u +%Y-%m-%d)" != "2026-10-27" ]; then
            echo "salta=1" >> "$GITHUB_OUTPUT"
            echo "Esta prueba programada solo vale el 27-oct-2026: no se hace nada."
          fi
      - name: Código (rama analisis-mercado)
        if: steps.fecha.outputs.salta != '1'
        uses: actions/checkout@v4
        with:
          ref: analisis-mercado
          path: codigo
      - name: Probar las claves
        if: steps.fecha.outputs.salta != '1'
        shell: bash
        working-directory: codigo/experimentos/analisis_mercado
        run: python3 prueba_instagram.py
