name: Buscar en X

on:
  workflow_dispatch:
    inputs:
      solicitud_id:
        description: "id de la solicitud en panel/data/solicitudes_x.json (lo crea el panel de Render)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Buscar en X con Claude y encolar las URLs encontradas
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 experimentos/ingesta_x/herramientas/buscar_x.py \
            --solicitud-id "${{ inputs.solicitud_id }}"
